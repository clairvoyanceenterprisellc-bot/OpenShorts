[project]
name = "openshorts"
version = "0.1.0"
description = "Auto-detect highlights in gameplay recordings and cut them into short clips"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "yt-dlp>=2024.4.9",
    "yt-dlp-ejs>=0.8.0",
    "pycryptodomex>=3.20; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
youtube-auth = ["google-auth-oauthlib>=1.2"]

[project.scripts]
openshorts = "openshorts.cli:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
